    function scrollIconPickerTabs(fieldName, offset) {
      const tabsEl = document.getElementById(`icon-tabs-${fieldName}`);
      if (tabsEl) {
        tabsEl.scrollBy({ left: offset, behavior: 'smooth' });
      }
    }

    function initIconPickerTabsMouseControl(tabsEl) {
      if (!tabsEl || tabsEl._hasMouseControl) return;
      tabsEl._hasMouseControl = true;

      // 1. Mouse wheel horizontal scrolling
      tabsEl.addEventListener('wheel', (e) => {
        if (e.deltaY !== 0) {
          e.preventDefault();
          tabsEl.scrollLeft += (e.deltaY * 0.9);
        }
      }, { passive: false });

      // 2. Mouse drag-to-scroll (grab & slide)
      let isDown = false;
      let startX;
      let scrollLeft;
      let dragged = false;

      tabsEl.addEventListener('mousedown', (e) => {
        isDown = true;
        dragged = false;
        tabsEl.classList.add('dragging');
        startX = e.pageX - tabsEl.offsetLeft;
        scrollLeft = tabsEl.scrollLeft;
      });

      const stopDrag = () => {
        if (!isDown) return;
        isDown = false;
        tabsEl.classList.remove('dragging');
        if (dragged) {
          // Temporarily suppress tab clicks that occurred during drag
          const tabs = tabsEl.querySelectorAll('.icon-picker-tab');
          tabs.forEach(t => t._preventClick = true);
          setTimeout(() => tabs.forEach(t => t._preventClick = false), 100);
        }
      };

      tabsEl.addEventListener('mouseleave', stopDrag);
      tabsEl.addEventListener('mouseup', stopDrag);

      tabsEl.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - tabsEl.offsetLeft;
        const walk = (x - startX) * 1.3;
        if (Math.abs(walk) > 4) {
          dragged = true;
        }
        tabsEl.scrollLeft = scrollLeft - walk;
      });
    }

    function handleIconPickerSearch(searchInput, fieldName) {
      filterIconPickerItems(fieldName);
    }

    function filterIconPickerItems(fieldName) {
      const container = document.getElementById(`icon-picker-container-${fieldName}`);
      if (!container) return;

      const activeTab = container.querySelector('.icon-picker-tab.active');
      const activeCat = activeTab ? activeTab.dataset.cat : 'all';

      const searchInput = container.querySelector('.icon-picker-search-input');
      const query = (searchInput ? searchInput.value.trim().toLowerCase() : '');

      const items = container.querySelectorAll('.icon-picker-item');
      let visibleCount = 0;
      items.forEach(item => {
        const catStr = item.dataset.categories || item.dataset.category || '';
        const itemCats = catStr.split(/\s+/);
        const iconName = item.dataset.icon.toLowerCase();
        const label = item.dataset.label.toLowerCase();
        const keywords = (item.dataset.keywords || '').toLowerCase();

        const matchesCat = (activeCat === 'all' || itemCats.includes(activeCat));
        const matchesQuery = !query || iconName.includes(query) || label.includes(query) || keywords.includes(query);

        if (matchesCat && matchesQuery) {
          item.style.display = 'flex';
          visibleCount++;
        } else {
          item.style.display = 'none';
        }
      });

      let emptyMsg = container.querySelector('.icon-picker-empty');
      if (visibleCount === 0) {
        if (!emptyMsg) {
          emptyMsg = document.createElement('div');
          emptyMsg.className = 'icon-picker-empty flex flex-col items-center justify-center p-6 text-center text-xs opacity-60 col-span-full gap-1.5';
          emptyMsg.style.gridColumn = '1 / -1';
          emptyMsg.innerHTML = '<span class="material-symbols-rounded text-2xl opacity-40">search_off</span><span>該当するアイコンが見つかりません</span>';
          const grid = container.querySelector('.icon-picker-grid');
          if (grid) grid.appendChild(emptyMsg);
        }
      } else {
        if (emptyMsg) emptyMsg.remove();
      }
    }

          const swatches = f.colors.map((c) => `
            <div class="color-swatch ${c.value === selectedVal ? 'active' : ''}" data-name="${f.name}" data-value="${c.value}" style="background:${c.hex};" onclick="selectColorSwatch(this)" title="${c.label}">
              <span class="material-symbols-rounded">check</span>
            </div>
          `).join('');
          return `
            <div class="form-group">
              <label>${f.label} ${reqBadge}</label>
              <input type="hidden" name="${f.name}" id="color-input-${f.name}" value="${selectedVal}">
              <div class="color-picker-group">
                ${swatches}
              </div>
            </div>
          `;
        }
        if (f.type === 'icon-picker') {
          const selectedVal = f.value || 'language';
          const selectedIconObj = BOOKMARK_ICONS.find(ic => ic.name === selectedVal) || { name: selectedVal, label: 'カスタム', category: 'all', categories: ['all'] };

          const catCounts = { all: BOOKMARK_ICONS.length };
          BOOKMARK_ICONS.forEach(ic => {
            const cats = ic.categories || [ic.category];
            cats.forEach(c => {
              catCounts[c] = (catCounts[c] || 0) + 1;
            });
          });

          const categories = [
            { id: 'all', label: `すべて (${catCounts.all})`, icon: 'apps' },
            { id: 'web', label: `Web (${catCounts.web || 0})`, icon: 'language' },
            { id: 'social', label: `SNS (${catCounts.social || 0})`, icon: 'chat' },
            { id: 'dev', label: `開発 (${catCounts.dev || 0})`, icon: 'code' },
            { id: 'work', label: `仕事 (${catCounts.work || 0})`, icon: 'description' },
            { id: 'media', label: `メディア (${catCounts.media || 0})`, icon: 'movie' },
            { id: 'life', label: `生活 (${catCounts.life || 0})`, icon: 'shopping_cart' },
            { id: 'tools', label: `ツール (${catCounts.tools || 0})`, icon: 'settings' }
          ];

          const tabsHtml = categories.map((cat, i) => `
            <button type="button" class="icon-picker-tab ${i === 0 ? 'active' : ''}" data-cat="${cat.id}" onclick="handleIconPickerTabClick(this, '${f.name}')">
              <span class="material-symbols-rounded" style="font-size: 13px;">${cat.icon}</span>
              <span>${cat.label}</span>
            </button>
          `).join('');

          const selectOptionsHtml = categories.map(c => `<option value="${c.id}">${c.label}</option>`).join('');

          const itemsHtml = BOOKMARK_ICONS.map(ic => {
            const catArr = ic.categories || [ic.category];
            const catStr = catArr.join(' ');
            return `
            <div class="icon-picker-item ${ic.name === selectedVal ? 'active' : ''}"
                 data-name="${f.name}"
                 data-icon="${ic.name}"
                 data-label="${escapeHtml(ic.label)}"
                 data-category="${ic.category}"
                 data-categories="${catStr}"
                 data-keywords="${escapeHtml(ic.keywords)}"
                 title="${escapeHtml(ic.label)} (${ic.name}) [${catArr.join(', ')}]"
                 onclick="selectIconPickerItem(this)">
              <span class="material-symbols-rounded">${ic.name}</span>
            </div>
          `;
          }).join('');

          return `
            <div class="form-group">
              <label>${f.label} ${reqBadge}</label>
              <input type="hidden" name="${f.name}" id="icon-input-${f.name}" value="${selectedVal}">
              <div class="icon-picker-container" id="icon-picker-container-${f.name}">
                <div class="icon-picker-header">
                  <div class="icon-picker-preview-box" id="icon-preview-box-${f.name}">
                    <span class="material-symbols-rounded" id="icon-preview-glyph-${f.name}">${selectedIconObj.name}</span>
                  </div>
                  <div class="icon-picker-preview-info">
                    <span class="icon-picker-preview-label" id="icon-preview-label-${f.name}">${selectedIconObj.label}</span>
                    <span class="icon-picker-preview-name" id="icon-preview-name-${f.name}">${selectedIconObj.name}</span>
                  </div>
                </div>
                <div class="icon-picker-controls-row">
                  <div class="icon-picker-search-wrapper flex-1">
                    <span class="material-symbols-rounded">search</span>
                    <input type="text" class="icon-picker-search-input" placeholder="アイコンを検索（例: コード、メール、動画）..." oninput="handleIconPickerSearch(this, '${f.name}')">
                  </div>
                  <select class="icon-picker-category-select" onchange="handleIconPickerCategorySelect(this, '${f.name}')" title="カテゴリを直接切り替え">
                    ${selectOptionsHtml}
                  </select>
                </div>
                <div class="icon-picker-tabs-wrapper">
                  <button type="button" class="icon-picker-scroll-btn" onclick="scrollIconPickerTabs('${f.name}', -130)" title="左へスクロール">
                    <span class="material-symbols-rounded">chevron_left</span>
                  </button>
                  <div class="icon-picker-tabs" id="icon-tabs-${f.name}">
                    ${tabsHtml}
                  </div>
                  <button type="button" class="icon-picker-scroll-btn" onclick="scrollIconPickerTabs('${f.name}', 130)" title="右へスクロール">
                    <span class="material-symbols-rounded">chevron_right</span>
                  </button>
                </div>
                <div class="icon-picker-grid" id="icon-grid-${f.name}">
                  ${itemsHtml}
                </div>
              </div>
            </div>
          `;
        }
        if (f.type === 'textarea') {
          const valStr = f.value !== undefined ? escapeHtml(f.value) : '';
          const rows = f.rows || 3;
          const placeholder = f.placeholder ? `placeholder="${escapeHtml(f.placeholder)}"` : '';
          return `
            <div class="form-group">
              <label>${f.label} ${reqBadge}</label>
              <textarea name="${f.name}" class="form-control" rows="${rows}" style="resize: vertical; min-height: 72px;" ${placeholder} ${f.required ? 'required' : ''}>${valStr}</textarea>
            </div>
          `;
        }
        if (f.type === 'select') {
          const opts = f.options.map((o, idx) => {
            const val = f.values ? f.values[idx] : o;
            const selected = f.value !== undefined && (String(f.value) === String(val) || String(f.value) === String(o)) ? 'selected' : '';
            return `<option value="${val}" ${selected}>${o}</option>`;
          }).join('');
          return `
            <div class="form-group">
              <label>${f.label} ${reqBadge}</label>
              <select name="${f.name}" class="form-control">${opts}</select>
            </div>
          `;
        }
        if (f.type === 'checkbox') {
          const checked = f.value ? 'checked' : '';
          return `
            <div class="form-group" style="display:flex; align-items:center; gap:0.5rem;">
              <input type="checkbox" name="${f.name}" id="${f.name}" ${checked}>
              <label for="${f.name}" style="margin:0;">${f.label} ${reqBadge}</label>
            </div>
          `;
        }
        const valStr = f.value !== undefined ? escapeHtml(f.value) : '';
        return `
          <div class="form-group">
            <label>${f.label} ${reqBadge}</label>
            <input type="${f.type}" name="${f.name}" class="form-control" value="${valStr}" ${f.required ? 'required' : ''}>
          </div>
        `;
      }).join('');

      // 入力時にバリデーションエラーを解除
      body.querySelectorAll('input, select, textarea').forEach(el => {
        el.addEventListener('input', () => {
          if (el.classList.contains('is-invalid') && el.value.trim()) {
            el.classList.remove('is-invalid');
            const parent = el.closest('.form-group');
            if (parent) {
              const errMsg = parent.querySelector('.field-error-msg');
              if (errMsg) errMsg.remove();
            }
          }
        });
      });

      const btn = document.getElementById('modal-submit');
      if (currentModalSubmit) {
        btn.removeEventListener('click', currentModalSubmit);
      }

      currentModalSubmit = () => {
        const data = {};
        const inputs = body.querySelectorAll('input, select, textarea');
        let valid = true;
        let firstInvalidInput = null;

        // エラー状態リセット
        body.querySelectorAll('.form-control').forEach(el => el.classList.remove('is-invalid'));
        body.querySelectorAll('.field-error-msg').forEach(el => el.remove());

        inputs.forEach(el => {
          const parentGroup = el.closest('.form-group');
          const isHidden = parentGroup && (parentGroup.style.display === 'none' || parentGroup.hidden);

          const val = el.type === 'checkbox' ? el.checked : (el.value ? el.value.trim() : '');
          if (!isHidden && el.required && !val) {
            valid = false;
            el.classList.add('is-invalid');
            if (!firstInvalidInput) firstInvalidInput = el;

            const parent = el.closest('.form-group');
            if (parent && !parent.querySelector('.field-error-msg')) {
              const errMsg = document.createElement('div');
              errMsg.className = 'field-error-msg';
              errMsg.innerHTML = '<span class="material-symbols-rounded" style="font-size:14px;">error</span> この項目は必須です';
              parent.appendChild(errMsg);
            }
          }
          data[el.name] = el.type === 'checkbox' ? el.checked : el.value;
        });

        if (!valid) {
          if (firstInvalidInput) firstInvalidInput.focus();
          showToast('必須項目を入力してください', 'error');
          return;
        }

        config.onSubmit(data);
      };

      btn.addEventListener('click', currentModalSubmit);
      document.getElementById('modal').classList.add('active');

      // Initialize mouse wheel & drag scrolling on icon picker tabs
      body.querySelectorAll('.icon-picker-tabs').forEach(initIconPickerTabsMouseControl);
    }

    function hideModal() {
      document.getElementById('modal').classList.remove('active');
      const btnSubmit = document.getElementById('modal-submit');
      if (btnSubmit) {
        btnSubmit.textContent = '保存';
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toasts');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;

      let icon = 'info';
      if (type === 'success') icon = 'check_circle';
      if (type === 'error') icon = 'error';

      toast.innerHTML = `
        <span class="material-symbols-rounded">${icon}</span>
        <span>${message}</span>
        <div class="toast-progress"></div>
      `;

      container.appendChild(toast);

      // Trigger reflow
      void toast.offsetWidth;
      toast.classList.add('show');

      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 400);
      }, 3000);
    }

    /* ========================================
       Tab Switching
       ======================================== */
    function switchTab(tabName) {
      // Update tab buttons
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      const activeTab = document.querySelector(`.tab[data-tab="${tabName}"]`);
      activeTab.classList.add('active');

      // Animate indicator
      updateTabIndicator();

      // Switch panels
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.getElementById(`panel-${tabName}`).classList.add('active');

      // Switch action buttons
      ['gmail', 'calendar', 'tasks'].forEach(name => {
        const action = document.getElementById(`tab-action-${name}`);
        if (action) action.style.display = name === tabName ? '' : 'none';
      });
    }

    function updateTabIndicator() {
      const bar = document.getElementById('tab-bar');
      const activeTab = bar.querySelector('.tab.active');
      const indicator = document.getElementById('tab-indicator');
      if (!activeTab || !indicator) return;

      const barRect = bar.getBoundingClientRect();
      const tabRect = activeTab.getBoundingClientRect();
      indicator.style.width = tabRect.width + 'px';
      indicator.style.left = (tabRect.left - barRect.left) + 'px';
    }

    // Initialize tab indicator after DOM ready
    window.addEventListener('load', () => {
      setTimeout(updateTabIndicator, 100);
    });
    window.addEventListener('resize', updateTabIndicator);
    window.addEventListener('orientationchange', () => {
      setTimeout(updateTabIndicator, 150);
    });

    /* ========================================
       Bookmark Drag & Drop
       ======================================== */
    let dragSrcIndex = null;

    function setupBookmarkDragAndDrop() {
      const container = document.getElementById('bookmarks-container');
      if (!container) return;

      container.addEventListener('dragstart', (e) => {
        const card = e.target.closest('.bookmark-card');
        if (!card) return;
        dragSrcIndex = parseInt(card.dataset.bmIndex, 10);
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', dragSrcIndex);
      });

      container.addEventListener('dragend', (e) => {
        const card = e.target.closest('.bookmark-card');
        if (card) card.classList.remove('dragging');
        document.querySelectorAll('.bookmark-card.drag-over').forEach(c => c.classList.remove('drag-over'));
      });

      container.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const card = e.target.closest('.bookmark-card');
        if (!card) return;
        const targetIndex = parseInt(card.dataset.bmIndex, 10);
        if (isNaN(targetIndex) || targetIndex === dragSrcIndex) return;
        document.querySelectorAll('.bookmark-card.drag-over').forEach(c => c.classList.remove('drag-over'));
        card.classList.add('drag-over');
      });

      container.addEventListener('dragleave', (e) => {
        const card = e.target.closest('.bookmark-card');
        if (card) card.classList.remove('drag-over');
      });

      container.addEventListener('drop', async (e) => {
        e.preventDefault();
        const targetCard = e.target.closest('.bookmark-card');
        document.querySelectorAll('.bookmark-card.drag-over').forEach(c => c.classList.remove('drag-over'));
        if (!targetCard) return;

        const targetIndex = parseInt(targetCard.dataset.bmIndex, 10);
        if (isNaN(dragSrcIndex) || isNaN(targetIndex) || dragSrcIndex === targetIndex) return;

        isJustDragged = true;

        // ローカル状態の並び替え
        const movedItem = state.bookmarks.splice(dragSrcIndex, 1)[0];
        state.bookmarks.splice(targetIndex, 0, movedItem);

        // 再描画
        renderBookmarks();

        // サーバーへ新しい順序で全保存
        try {
          const res = await callServer('saveAllBookmarks', state.email, state.bookmarks);
          if (res && res.error) throw new Error(res.error);
          showToast('並び替えを保存しました', 'success');
          loadBookmarks();
        } catch (err) {
          showToast('並び替えの保存に失敗しました', 'error');
          loadBookmarks();
        } finally {
          dragSrcIndex = null;
        }
      });
    }
  </script>
</body>
